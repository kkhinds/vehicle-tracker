<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vehicle Tracker</title>
  <style>
    /* Driver's Log splash. Tokens mirror src/styles/tokens.css so the launch
       frame and the first painted screen read as the same app. Barlow isn't
       available here (the splash loads straight off disk, outside the bundled
       renderer), so the condensed-caps feel comes from tracking instead. */
    :root {
      --bg-a: #0A0E14;
      --bg-b: #101A29;
      --line: #1E2735;
      --text: #EDF1F7;
      --dim: #7E8A9C;
      --faint: #5F6C7D;
      --accent: #FFAA2B;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(120% 90% at 50% 100%, var(--bg-b) 0%, var(--bg-a) 70%);
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* Same converging road that sits behind the app's hero. */
    .road {
      position: absolute;
      inset: auto 0 0 0;
      height: 44%;
      width: 100%;
      opacity: .45;
    }
    .road line { stroke: var(--line); stroke-width: 1; }
    .road .mid { stroke: var(--accent); stroke-opacity: .22; stroke-dasharray: 10 14; }

    .stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      filter: drop-shadow(0 10px 30px rgba(255, 170, 43, .28));
      animation: floaty 3.2s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    .eyebrow {
      margin: 0;
      color: var(--dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .28em;
    }
    .title {
      margin: -8px 0 0 0;
      color: var(--text);
      font-size: 23px;
      font-weight: 600;
      letter-spacing: .1em;
    }
    .byline {
      margin: -6px 0 0 0;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: .02em;
    }

    /* Progress reads as a stretch of road rather than a spinner. */
    .track {
      position: relative;
      width: 132px;
      height: 2px;
      margin-top: 6px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }
    .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 44px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sweep 1.5s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-44px); }
      100% { transform: translateX(132px); }
    }

    .status {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      margin: 0;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: .04em;
    }

    /* Dev builds say so — the splash is otherwise identical to the shipped app. */
    .devtag {
      display: none;
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 10px;
      border: 1px solid #2BD98F;
      border-radius: 999px;
      color: #2BD98F;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
      .track::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <p class="devtag" id="devtag">DEV BUILD</p>
    <svg class="road" viewBox="0 0 420 200" preserveAspectRatio="none" aria-hidden="true">
      <line x1="-40" y1="200" x2="196" y2="0" />
      <line x1="460" y1="200" x2="224" y2="0" />
      <line class="mid" x1="210" y1="200" x2="210" y2="0" />
    </svg>

    <div class="stack">
      <img class="logo" src="logo.svg" alt="" />
      <p class="eyebrow">DRIVER'S LOG</p>
      <h1 class="title">VEHICLE TRACKER</h1>
      <p class="byline">Built by Kemar Hinds</p>
      <div class="track" role="progressbar" aria-label="Starting up"></div>
    </div>

    <p class="status">Loading your vehicles…</p>
  </div>
  <script>
    // main passes ?dev=1 when running unpackaged.
    if (new URLSearchParams(location.search).get('dev')) {
      document.getElementById('devtag').style.display = 'block'
    }
  </script>
</body>
</html>
