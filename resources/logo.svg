<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Driver's Log mark: road running to the horizon, centre line dashed.
       One bold amber shape on a dark tile — it has to survive 16px in the
       taskbar, where anything finer turns to mush. Amber is the app accent. -->
  <defs>
    <linearGradient id="vt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131C2A"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
    <!-- Road fades out toward the vanishing point instead of ending on a hard
         edge, which is what sells the perspective at large sizes. -->
    <linearGradient id="vt-road" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFC155"/>
      <stop offset="45%" stop-color="#FFAA2B"/>
      <stop offset="100%" stop-color="#D97A00" stop-opacity=".3"/>
    </linearGradient>
    <!-- The road runs off the bottom edge, so it has to be clipped to the tile
         or it squares off the two bottom corners. -->
    <clipPath id="vt-clip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#vt-bg)"/>

  <path d="M 3 64 L 26 12 L 38 12 L 61 64 Z" fill="url(#vt-road)" clip-path="url(#vt-clip)"/>

  <!-- Centre line, shrinking with distance -->
  <g stroke="#0A0E14" stroke-opacity=".5" stroke-linecap="butt">
    <line x1="32" y1="60" x2="32" y2="50" stroke-width="3.4"/>
    <line x1="32" y1="44" x2="32" y2="37" stroke-width="2.6"/>
    <line x1="32" y1="32" x2="32" y2="27" stroke-width="1.9"/>
  </g>

  <!-- Tile edge, so the icon keeps a silhouette on a dark taskbar -->
  <rect x=".5" y=".5" width="63" height="63" rx="13.5"
        fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
</svg>
